name: CI

on:
  push:
  pull_request:

jobs:
  daemon:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Example config loads
        run: python -c "import red_alert; red_alert.load_config(red_alert.EXAMPLE_CONFIG)"
      - name: CLI help
        run: python red_alert.py --help

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n install.sh && bash -n uninstall.sh
      - name: JSON manifests parse
        run: |
          for f in .claude-plugin/marketplace.json plugin/.claude-plugin/plugin.json plugin/hooks/hooks.json; do
            python3 -m json.tool "$f" > /dev/null && echo "ok $f"
          done
